<nav class="sticky top-0 z-50 w-full bg-[#fbfbfd]/80 backdrop-blur-md border-b border-gray-200/50">
  <div class="max-w-[1400px] mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-[52px] relative">
      
      <!-- Logo -->
      <div class="flex shrink-0 items-center cursor-default">
        <span class="text-xl font-semibold tracking-tight text-gray-900">CartSure.</span>
      </div>

      <!-- Navigation Links (Centered) -->
      <div class="hidden md:flex space-x-10 absolute left-1/2 -translate-x-1/2">
        <a routerLink="/products" class="text-[12px] font-medium text-gray-500 hover:text-black transition-colors">All Products</a>
        <a routerLink="/contact" class="text-[12px] font-medium text-gray-500 hover:text-black transition-colors">Contact Us</a>
        <a (click)="scrollToBottom($event)" class="text-[12px] font-medium text-gray-500 hover:text-black transition-colors cursor-pointer">About</a>
      </div>

      <!-- Right icons: Search, Wishlist, Cart, Auth -->
      <div class="flex items-center space-x-6">
        <!-- Search -->
        <button routerLink="/products" class="text-gray-500 hover:text-black transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-[15px] h-[15px]">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
          </svg>
        </button>
        <!-- Wishlist -->
        <button routerLink="/wishlist" class="text-gray-500 hover:text-black transition-colors relative">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-[15px] h-[15px]">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z" />
          </svg>
          @if (wishlistCount$ | async; as wlCount) {
            @if (wlCount > 0) {
              <span class="absolute -top-[7px] -right-[9px] bg-red-500 text-white text-[10px] leading-none font-bold min-w-[17px] h-[17px] px-1 rounded-full border-2 border-[#fbfbfd] flex items-center justify-center animate-fade-in">
                {{ wlCount }}
              </span>
            }
          }
        </button>
        <!-- Cart -->
        <button routerLink="/cart" class="text-gray-500 hover:text-black transition-colors relative" [class.animate-bounce-small]="cartBump()">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-[15px] h-[15px]">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 10-7.5 0v4.5m11.356-1.993l1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 01-1.12-1.243l1.264-12A1.125 1.125 0 015.513 7.5h12.974c.576 0 1.059.435 1.119 1.007zM8.625 10.5a.375.375 0 11-.75 0 .375.375 0 01.75 0zm7.5 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" />
          </svg>
          @if (cartCount$ | async; as count) {
            @if (count > 0) {
              <span class="absolute -top-[7px] -right-[9px] bg-black text-white text-[10px] leading-none font-bold min-w-[17px] h-[17px] px-1 rounded-full border-2 border-[#fbfbfd] flex items-center justify-center">
                {{ count }}
              </span>
            }
          }
        </button>
        <!-- Auth (Sign In / User Profile) -->
        <div class="relative group">
          <button routerLink="/auth" class="text-gray-500 hover:text-black transition-colors flex items-center">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-[15px] h-[15px]">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
            </svg>
            @if (currentUser$ | async; as user) {
              <span class="ml-2 text-[12px] font-medium hidden lg:block">{{ user.name.slice(0, 4) }}</span>
            }
          </button>

          <!-- Hover Dropdown for Logout -->
          @if (currentUser$ | async; as user) {
            <div class="absolute right-0 top-full pt-2 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200">
              <div class="bg-white border border-gray-200 rounded-xl shadow-xl py-2 px-1 min-w-[140px]">
                <button routerLink="/orders" class="w-full text-left px-4 py-2 text-[13px] font-medium text-gray-700 hover:bg-gray-50 rounded-lg transition-colors">
                  My Orders
                </button>
                <div class="h-px bg-gray-100 my-1 mx-2"></div>
                <button (click)="onLogout()" class="w-full text-left px-4 py-2 text-[13px] font-medium text-red-600 hover:bg-red-50 rounded-lg transition-colors">
                  Logout
                </button>
              </div>
            </div>
          }
        </div>
      </div>
    </div>
  </div>
</nav>
