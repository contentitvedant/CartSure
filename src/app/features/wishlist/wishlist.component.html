<div class="max-w-[1400px] mx-auto px-4 sm:px-6 lg:px-8 py-10 md:py-16">
  
  <h1 class="text-4xl font-semibold tracking-tight text-gray-900 mb-10 border-l-[3px] border-black pl-4 h-[44px] flex items-center">Your Wishlist</h1>

  @if ((wishlistItems$ | async)?.length === 0) {
    <div class="py-24 flex flex-col items-center justify-center text-center bg-[#fbfbfd] rounded-[2rem] border border-gray-100">
      <div class="w-20 h-20 bg-white shadow-sm border border-gray-100 rounded-full flex items-center justify-center mb-6">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-10 h-10 text-gray-300">
           <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z" />
        </svg>
      </div>
      <h2 class="text-2xl font-semibold text-gray-900 mb-2">Your wishlist is empty.</h2>
      <p class="text-gray-500 mb-8 font-medium">Save items you love so you can easily find them later.</p>
      <button routerLink="/products" class="bg-black text-white px-8 py-3.5 rounded-full text-[17px] font-medium hover:bg-gray-800 transition-colors shadow-sm active:scale-95">
        Explore Products
      </button>
    </div>
  } @else {
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
      @for (product of (wishlistItems$ | async); track product.id) {
        <app-product-card [product]="product"></app-product-card>
      }
    </div>
  }
</div>
