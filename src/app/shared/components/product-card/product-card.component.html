<div class="group flex flex-col glass-card rounded-[2.5rem] p-4 pb-8 transition-all duration-500 hover:shadow-[0_20px_40px_-15px_rgba(0,0,0,0.05)] cursor-pointer h-full border-transparent hover:border-white/50" [routerLink]="['/products', product.id]">
  <div class="relative aspect-square mb-6 overflow-hidden rounded-[2rem] bg-[#f5f5f7] transition-transform duration-500 group-hover:-translate-y-1">
    <img [src]="product.imageUrl" [alt]="product.name" class="object-cover w-full h-full transition-transform duration-1000 group-hover:scale-105 mix-blend-multiply">
    
    <!-- Quick action buttons -->
    <div class="absolute top-4 right-4 transition-opacity duration-300" [ngClass]="isInWishlist ? 'opacity-100' : 'opacity-0 group-hover:opacity-100'">
      <button class="backdrop-blur-md p-2.5 rounded-full shadow-sm transition-colors" 
              [ngClass]="isInWishlist ? 'bg-white text-red-500 hover:bg-gray-50' : 'bg-white/70 hover:bg-white text-gray-800'"
              (click)="toggleWishlist($event)">
        <svg xmlns="http://www.w3.org/2000/svg" [attr.fill]="isInWishlist ? 'currentColor' : 'none'" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z" />
        </svg>
      </button>
    </div>
  </div>
  
  <div class="flex flex-col flex-grow text-center items-center px-4">
    <!-- Category & Status -->
    <div class="flex items-center space-x-2 mb-3">
      @if (product.stock === 0) {
        <span class="text-[11px] font-semibold tracking-wider text-red-500 uppercase">Sold Out</span>
      } @else if (product.stock < 10) {
        <span class="text-[11px] font-semibold tracking-wider text-orange-500 uppercase">Low Stock</span>
      } @else {
        <span class="text-[11px] font-semibold tracking-wider text-gray-400 uppercase">{{ product.category }}</span>
      }
    </div>
    
    <h3 class="text-[21px] font-medium text-gray-900 mb-1 tracking-tight">{{ product.name }}</h3>
    <p class="text-[15px] text-gray-500 mb-6 line-clamp-2 max-w-[90%]">{{ product.description }}</p>
    
    <div class="mt-auto w-full flex flex-col items-center pt-2">
      <span class="text-[17px] font-medium text-gray-900 mb-4">{{ product.price | currency:'INR':'symbol':'1.0-0' }}</span>
      <button 
        [disabled]="product.stock === 0 || isAdded"
        [class.opacity-50]="product.stock === 0"
        class="w-[140px] flex items-center justify-center px-5 py-2.5 rounded-full text-[14px] font-medium transition-all duration-300 active:scale-95 disabled:hover:scale-100" 
        [ngClass]="isAdded ? 'bg-green-600 text-white' : 'bg-gray-900 text-white hover:bg-black'"
        (click)="addToCart($event)">
        @if (isAdded) {
          <div class="flex items-center space-x-2 animate-in fade-in zoom-in duration-300">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="currentColor" class="w-4 h-4">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
            </svg>
            <span>Added</span>
          </div>
        } @else {
          Buy
        }
      </button>
    </div>
  </div>
</div>
